<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>wwwv.uz — Domen sotiladi</title>
    <meta name="description" content="wwwv.uz domeni sotiladi. Bog‘lanish uchun Telegram orqali yozing.">

    <!-- Orqa foni shaffof qilingan logotipni chaqirish -->
    <link rel="icon" type="image/png" href="image/favicon.png">

    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-secondary: #a1a1a6;
            --domain-color: #5e9cff;
            --btn-bg: linear-gradient(135deg, #2AABEE, #229ED9);
            --btn-shadow: rgba(34, 158, 217, 0.3);
            --sticker-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f5f5f7;
                --card-bg: rgba(255, 255, 255, 0.65);
                --card-border: rgba(0, 0, 0, 0.05);
                --text-main: #1d1d1f;
                --text-secondary: #86868b;
                --domain-color: #0066cc;
                --btn-bg: linear-gradient(135deg, #2AABEE, #0088cc);
                --sticker-bg: linear-gradient(145deg, #ffffff, #f0f0f5);
            }
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(94, 156, 255, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 45, 85, 0.1), transparent 25%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        /* Tashrif buyuruvchilar hisoblagichi (O'ng yuqori burchak) */
        .counter-box {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 14px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 1000;
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(-20px);
        }

        .counter-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .counter-box img {
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        @keyframes slideDown {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Orqa fondagi yumshoq chiroqlar */
        .glow-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: drift 10s ease-in-out infinite alternate;
        }

        .glow.blue {
            width: 400px;
            height: 400px;
            background: #007aff;
            top: -10%;
            left: -10%;
        }

        .glow.purple {
            width: 300px;
            height: 300px;
            background: #5856d6;
            bottom: -10%;
            right: -10%;
            animation-delay: -5s;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        /* Asosiy Karta (Glassmorphism) */
        .card {
            position: relative;
            width: 100%;
            max-width: 480px;
            padding: 50px 40px;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 36px;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            box-shadow: 
                0 40px 80px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Sticker */
        .sticker {
            width: 104px;
            height: 104px;
            margin: 0 auto 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 28px;
            background: var(--sticker-bg);
            border: 1px solid var(--card-border);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.15),
                inset 0 2px 4px rgba(255, 255, 255, 0.3);
            transform: rotate(-5deg);
            animation: float 4s ease-in-out infinite;
        }

        .sticker svg {
            width: 68px;
            height: 68px;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.2));
        }

        @keyframes float {
            0%, 100% { transform: rotate(-5deg) translateY(0); }
            50% { transform: rotate(2deg) translateY(-10px); }
        }

        /* Typography */
        h1 {
            margin: 0;
            font-size: clamp(32px, 8vw, 48px);
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.1;
            background: linear-gradient(135deg, var(--text-main) 30%, #888 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .domain {
            margin-top: 10px;
            font-size: clamp(24px, 6vw, 32px);
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--domain-color);
        }

        .description {
            margin: 20px auto 32px;
            font-size: 17px;
            line-height: 1.5;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Telegram Tugmasi */
        .telegram {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px 24px;
            border-radius: 20px;
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            background: var(--btn-bg);
            box-shadow: 0 10px 25px var(--btn-shadow);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .telegram:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px var(--btn-shadow);
        }

        .telegram:active {
            transform: scale(0.98);
        }

        .telegram svg {
            width: 26px;
            height: 26px;
        }

        /* Footer */
        .footer {
            margin-top: 32px;
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Responsive Media Queries */
        @media (max-width: 480px) {
            .card {
                padding: 40px 24px 30px;
                border-radius: 32px;
            }
            .sticker {
                width: 90px;
                height: 90px;
                border-radius: 24px;
            }
            .sticker svg {
                width: 58px;
                height: 58px;
            }
            .description {
                font-size: 16px;
            }
            .telegram {
                padding: 16px 20px;
                font-size: 17px;
            }
            
            /* Telefonlarda hisoblagich */
            .counter-box {
                top: 15px;
                right: 15px;
                padding: 8px 12px;
                border-radius: 12px;
            }
            .counter-label {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>

    <!-- Kiruvchilarni hisoblovchi blok -->
    <!-- Kiruvchilarni hisoblovchi blok -->
    <div class="counter-box">
        <span class="counter-label">Tashriflar jami</span>
        <img src="https://hits.sh/wwwv.uz.svg?style=for-the-badge&label=👁&color=229ED9&labelColor=2A2A35" alt="Statistika">
    </div>

    <!-- Orqa fon effektlari -->
    <div class="glow-container">
        <div class="glow blue"></div>
        <div class="glow purple"></div>
    </div>

    <!-- Asosiy Karta -->
    <main class="card">

        <!-- iOS Uslubidagi 3D Vektor Raketa SVG -->
        <div class="sticker">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
                <defs>
                    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="100%" stop-color="#e2e8f0"/>
                    </linearGradient>
                    <linearGradient id="windowOuter" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#cbd5e1"/>
                        <stop offset="100%" stop-color="#94a3b8"/>
                    </linearGradient>
                    <linearGradient id="windowInner" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#38bdf8"/>
                        <stop offset="100%" stop-color="#0284c7"/>
                    </linearGradient>
                    <linearGradient id="fins" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#f87171"/>
                        <stop offset="100%" stop-color="#dc2626"/>
                    </linearGradient>
                    <linearGradient id="nose" x1="0%" y1="0%" x2="100%" y2="100%">

                    <linearGradient id="flame" x1="0%" y1="0%" x2="100%" y2="100%">

                    </linearGradient>
                    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
                    </filter>
                </defs>

                <g transform="rotate(45 50 50) translate(0, -5)">
                    <path d="M 35 80 Q 50 115 65 80 Q 50 85 35 80 Z" fill="url(#flame)" filter="url(#shadow)"/>
                    <path d="M 42 80 Q 50 100 58 80 Q 50 82 42 80 Z" fill="#fef08a"/>
                    <path d="M 35 55 L 12 78 L 35 70 Z" fill="url(#fins)" filter="url(#shadow)"/>
                    <path d="M 65 55 L 88 78 L 65 70 Z" fill="url(#fins)" filter="url(#shadow)"/>
                    <path d="M 50 65 L 50 85 L 55 75 Z" fill="#991b1b"/>
                    <path d="M 50 15 C 30 35 30 70 35 80 L 65 80 C 70 70 70 35 50 15 Z" fill="url(#body)" filter="url(#shadow)"/>
                    <path d="M 50 15 C 41 24 36 34 33 45 L 67 45 C 64 34 59 24 50 15 Z" fill="url(#nose)"/>
                    <circle cx="50" cy="55" r="11" fill="url(#windowOuter)"/>
                    <circle cx="50" cy="55" r="8" fill="url(#windowInner)"/>
                    <path d="M 45 49 A 8 8 0 0 1 56 51 A 8 8 0 0 0 45 58 Z" fill="#bae6fd" opacity="0.6"/>
                </g>
            </svg>
        </div>

        <h1>Domen sotiladi</h1>

        <div class="domain">
            wwwv.uz
        </div>

        <p class="description">
            Qisqa, esda qoladigan va chiroyli domen.<br>
            Domenni sotib olish bo‘yicha bog‘lanish uchun Telegram orqali yozing.
        </p>

        <!-- Telegram Tugmasi -->
        <a class="telegram" href="https://t.me/bshaxriyor" target="_blank" rel="noopener noreferrer">

            <span>@bshaxriyor</span>

        <div class="footer">
            © 2026 wwwv.uz
        </div>

    </main>

</body>
</html>
